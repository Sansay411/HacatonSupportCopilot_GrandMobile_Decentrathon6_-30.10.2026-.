<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Sentra by LGTM</title>
<!-- Титульная карточка видео. Знак и лок-ап: admin_ui/assets/sentra-lockup.svg без изменений. Палитра и шрифт те же, что в интерфейсе. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500&display=swap&subset=cyrillic">
<style>
  :root { --s1:#0C0F0E; --t1:#EDF3F1; --t2:#A5B2AE; --t3:#76847F; --signal:#2FD9B5; }
  html, body { margin:0; height:100%; background:var(--s1); }
  body {
    width:1920px; height:1080px; display:grid; place-items:center; overflow:hidden;
    font-family:'Onest','Segoe UI Variable','Segoe UI',system-ui,sans-serif; color:var(--t1);
    background:radial-gradient(980px 560px at 50% 47%, rgba(47,217,181,.075), transparent 70%), var(--s1);
  }
  .wrap { display:flex; flex-direction:column; align-items:center; gap:40px; transform:translateY(-8px); }
  .lock { width:960px; height:auto; display:block; }
  .desc { font-size:32px; font-weight:400; color:var(--t2); letter-spacing:.004em; }
  .meta { font-size:23px; color:var(--t3); margin-top:-14px; letter-spacing:.01em; display:none; }
  body.outro .meta { display:block; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="lock" src="../../admin_ui/assets/sentra-lockup.svg" alt="Sentra by LGTM">
    <div class="desc">Командный центр ИИ-модерации для Grand Mobile</div>
    <div class="meta">Decentrathon 6.0 · Grand Mobile Support Copilot</div>
  </div>
  <script>if (location.hash === '#outro') document.body.classList.add('outro');</script>
</body>
</html>
